<div class="cw-block-inspector cw-display-inspector" data-block-inspector-root data-node-id="{{ node_id }}" data-node-type="{{ node_type }}">
  <div class="inspector-selection {{ summary_hidden }}" data-node-type="{{ node_type }}">
    <div class="inspector-node-card">
      <div class="inspector-node-icon">{{ node_icon }}</div>
      <div class="inspector-node-copy">
        <strong>{{ node_title }}</strong>
        <span>{{ node_kind }}</span>
      </div>
      <span class="inspector-node-tag">{{ node_tag }}</span>
    </div>
    <div class="inspector-tabs">
      <button class="inspector-tab {{ general_active }}" data-inspector-tab="general" type="button">Général</button>
      <button class="inspector-tab {{ ports_active }} {{ ports_tab_hidden }}" data-inspector-tab="ports" type="button" {{ ports_tab_disabled }}>Ports</button>
    </div>
  </div>

  <div class="inspector-view {{ general_hidden }}" data-inspector-panel-tab="general">
    <div class="field-group {{ title_hidden }}">
      <label>Nom du node</label>
      <input data-node-title-input type="text" placeholder="{{ node_title_placeholder }}" value="{{ node_title }}" />
    </div>
    <div class="inspector-actions {{ actions_hidden }}">
      <button class="ghost-btn {{ duplicate_hidden }}" data-block-action="duplicate" type="button">Dupliquer</button>
    </div>
    <div class="field-group">
      <label>Sources</label>
      <input type="text" readonly value="{{ display_source }}" />
    </div>
    <div class="field-group">
      <label>Contenu capture</label>
      <textarea rows="14" readonly>{{ display_output }}</textarea>
    </div>
    <label class="checkbox-field">
      <input data-html-allow-scripts data-block-config-field="allow_scripts" data-block-value-type="boolean" type="checkbox" {{ allow_scripts_checked }} />
      <span>Autoriser l'exécution JavaScript dans le rendu HTML</span>
    </label>
    <p class="field-hint">
      Le HTML capturé est affiché comme source échappée dans ce panneau et dans le modal du bloc.
    </p>
    <div class="inspector-actions">
      <button class="solid-btn" data-block-apply type="button" disabled>Appliquer</button>
    </div>
  </div>

  <div class="inspector-view {{ ports_hidden }}" data-inspector-panel-tab="ports">
    <div class="ports-editor-section">
      <div class="ports-editor-header">
        <span class="group-label">Entrées</span>
        <span class="ports-editor-actions">
          <button class="ghost-btn add-port-btn {{ add_mcp_input_hidden }}" data-add-mcp-input-port type="button" {{ add_mcp_input_disabled }}>+ MCP</button>
          <button class="ghost-btn add-port-btn {{ add_input_hidden }}" data-add-input-port type="button" {{ add_input_disabled }}>+ Ajouter une entrée</button>
        </span>
      </div>
      <div class="ports-editor-list">{{ inputs_html }}</div>
    </div>
    <div class="ports-editor-section">
      <div class="ports-editor-header">
        <span class="group-label">Sorties</span>
        <button class="ghost-btn add-port-btn {{ add_output_hidden }}" data-add-output-port type="button" {{ add_output_disabled }}>+ Ajouter une sortie</button>
      </div>
      <div class="ports-editor-list">{{ outputs_html }}</div>
    </div>
    <div class="inspector-copy">
      Les noms sont normalisés automatiquement : minuscules, espaces remplacés par <code>_</code>.
    </div>
  </div>
</div>
